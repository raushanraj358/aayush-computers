// Products, requests (orders, repairs, enquiries) and notifications all come from Supabase. Row level security limits each user to their own rows.
async function loadData(){if(!S.user||!sb)return;const uid=S.user.id;

sb.from("products").select("*").order("category").order("price"),
sb.from("requests").select("*,status_history(status,changed_at),profiles(full_name,email,phone)").order("created_at"),
sb.from("notifications").select("id,request_id,message,read,created_at").order("created_at",{ascending:false}).limit(100)]);
if(!S.user||S.user.id!==uid)return;
if(!p.error)S.products=p.data.map(mapProd);if(!r.error)S.reqs=r.data.map(mapReq);
if(!n.error){const before=S.notesIn?new Set(S.notes.map(x=>x.id)):null;S.notes=n.data.reverse().map(x=>({id:x.id,rid:x.request_id,text:x.message,at:x.created_at,time:when(x.created_at),read:x.read}));S.notesIn=true;
if(before){const fresh=S.notes.filter(x=>!x.read&&!before.has(x.id));if(fresh.length){S.ring=true;if(S.view=="notes"){fresh.forEach(x=>S.newIds.add(x.id));markRead()}else if(Date.now()-S.quiet>8000)popUp(fresh)}}}

function home(){return '<div class="hd"><div class="brand"><div class="logo">'+ic("mon",26)+'</div><div><b>AAYUSH COMPUTERS</b><small>Your Trusted Technology Partner</small></div><span class="sp"></span>'+bellBtn()+'<button class="ib" data-a="nav" data-v="profile" aria-label="Profile">'+ic("user",32)+'</button></div><h1>Welcome to Aayush Computers!</h1><p>All Computer Solutions Under One Roof.</p><div class="search">'+ic("search",20)+'<input id="q" placeholder="Search laptops, printers, CCTV..." aria-label="Search products"></div></div><div class="body"><h2>Explore Categories</h2><div class="cats">'+CATS.map(c=>'<button class="cat" data-a="cat" data-v="'+c+'">'+ic(c,30)+c+'</button>').join("")+'</div><div class="assist"><h2>Need assistance?</h2><p>Connect with our team for product enquiries and technical support.</p><p style="margin:-6px 0 14px;font-weight:600;color:var(--ink)">'+OWNER+' · 90064 34998</p><div class="two"><a class="b g" href="tel:'+SHOP_PHONE+'">'+ic("phone",20)+'Call Now</a><button class="b" data-a="newreq" data-v="enquiry">'+ic("chat",20)+'Enquiry</button></div></div></div>'}
function shop(){const q=S.q.toLowerCase(),L=S.products.filter(p=>p.on&&(S.cat=="All"||p.cat==S.cat)&&p.name.toLowerCase().includes(q));
return bar("Shop")+'<div class="body"><div class="chips">'+["All",...CATS.slice(0,5)].map(c=>'<button class="chip '+(S.cat==c?"on":"")+'" data-a="chip" data-v="'+c+'">'+c+'</button>').join("")+'</div>'+fromBanner()+(S.q?'<p class="mute">Results for “'+esc(S.q)+'” <button class="chip" data-a="clearq">Clear</button></p>':'')+(!S.loaded?WAIT:L.length?L.map(p=>'<div class="card pc"><div class="art">'+pic(p)+'</div><div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(p.name)+'</div><div class="mute">'+p.cat+(p.used?" · Second-hand":"")+'</div><div style="font-weight:700;margin:4px 0 8px">'+rs(p.price)+'</div><button class="b sm" data-a="order" data-id="'+p.id+'">Order</button></div></div>').join(""):'<div class="card"><b>No products found.</b><p class="mute">Try another category, or send us an enquiry.</p><button class="b sm" data-a="newreq" data-v="enquiry">Send enquiry</button></div>')+'</div>'}
function reqs(){const m=S.reqs.filter(r=>r.uid==S.user.id);return bar("My requests")+'<div class="body">'+(!S.loaded?WAIT:m.length?m.slice().reverse().map(r=>reqCard(r,false)).join(""):'<div class="card"><b>Nothing here yet.</b><p class="mute">Book a repair or send an enquiry to get started.</p></div>')+'<button class="b" style="width:100%" data-a="newreq" data-v="service">New request</button></div>'}
function newreq(){return bar("New request")+'<div class="body"><div class="card"><label for="ty" style="margin-top:0">What do you need?</label><select id="ty"><option value="service" '+(S.ft=="service"?"selected":"")+'>Repair my device</option><option value="enquiry" '+(S.ft=="enquiry"?"selected":"")+'>Ask about a product</option></select><label for="dv">Type</label><select id="dv"><option>Computer / Laptop</option><option>Printer</option><option>CCTV camera</option><option>Networking</option><option>Other</option></select><label for="ti">Device or product</label><input class="f" id="ti" placeholder="e.g. HP laptop, or 4 CCTV cameras"><label for="mp">Mobile number</label><input class="f" id="mp" inputmode="tel" autocomplete="tel" value="'+esc(S.user.phone||"")+'"><label for="de">Describe the problem or requirement</label><textarea id="de"></textarea><p><button class="b" style="width:100%" data-a="submit">Send request</button></p></div></div>'}
function profile(){const o=S.user.role=="owner";return bar("Profile")+'<div class="body"><div class="card"><b>'+esc(S.user.name||(o?OWNER:"Customer"))+'</b><div class="mute">'+(o?"Shop owner · ":"")+esc(S.user.phone||S.user.email)+'</div></div><button class="b o" style="width:100%" data-a="logout">Sign out</button></div>'}
function customer(){const v=S.view,m={home,shop,reqs,newreq,profile,notes:notesView,order:orderView};return (m[v]||home)()+nav([["home","Home","home"],["shop","Shop","bag"],["reqs","Requests","clip"],["profile","Profile","user"]])}
// Owner request filters: the three boxes at the top of Requests, plus Completed.
const isDone=r=>r.s>=FLOW[r.type].length-1;
const OF={open:{box:"Open",title:"Open requests",empty:"All caught up. No open requests.",test:r=>!isDone(r)},
repair:{box:"Repairs",title:"Open repairs",empty:"No repairs in progress.",test:r=>r.type=="service"&&!isDone(r)},
new:{box:"New",title:"New, not started",empty:"Nothing new. Every request has been picked up.",test:r=>r.s==0&&!isDone(r)},
done:{title:"Completed",empty:"Nothing completed yet.",test:isDone}};
function owner(){const R=S.reqs,open=R.filter(r=>r.s<FLOW[r.type].length-1);let b;if(S.view=="notes")return notesView()+nav([["orq","Requests","clip"],["prod","Products","bag"],["profile","Profile","user"]]);
if(S.view=="profile")return profile()+nav([["orq","Requests","clip"],["prod","Products","bag"],["profile","Profile","user"]]);
if(S.view=="prod")b=prodAdmin();else if(S.view=="pedit")b=prodEdit();
else{const f=OF[S.of]?S.of:"open",list=R.filter(OF[f].test),
box=k=>'<button type="button" class="card stat'+(f==k?' on':'')+'" data-a="ofilter" data-v="'+k+'" aria-pressed="'+(f==k)+'"><b>'+(S.loaded?R.filter(OF[k].test).length:"–")+'</b><span class="mute">'+OF[k].box+'</span></button>';
b=bar("Requests")+'<div class="body"><div class="stats">'+box("open")+box("repair")+box("new")+'</div><div class="row" style="align-items:center;margin-bottom:10px"><h2 style="margin:0">'+OF[f].title+(S.loaded?' ('+list.length+')':'')+'</h2>'+(f=="open"?'<button type="button" class="lnk" data-a="ofilter" data-v="done">Completed ('+R.filter(OF.done.test).length+')</button>':'<button type="button" class="lnk" data-a="ofilter" data-v="open">Show all open</button>')+'</div>'
+(!S.loaded?WAIT:list.length?list.slice().reverse().map(r=>reqCard(r,true)).join(""):'<div class="card"><b>'+OF[f].empty+'</b></div>')+'</div>'}
return b+nav([["orq","Requests","clip"],["prod","Products","bag"],["profile","Profile","user"]])}
// Redrawing the same screen (background refresh, new notification) keeps whatever the user has typed.
let lastKey="";
const FOOT='<footer class="foot">© 2026 Aayush Computers. All Rights Reserved.</footer>';
function render(){const y=window.scrollY;let h=S.boot?'<div class="hd"><div class="brand"><div class="logo">'+ic("mon")+'</div><div><b>AAYUSH COMPUTERS</b><small>Your Trusted Technology Partner</small></div></div></div><div class="body"><p class="mute" role="status">Loading…</p></div>':(!S.user||S.recovery)?login():S.user.role=="owner"?owner():customer();const app=document.getElementById("app"),key=[S.user&&S.user.id,S.boot,S.recovery,S.mode,S.view,S.ep,S.op].join("|"),same=key==lastKey&&!S.fresh,keep={},foc=document.activeElement&&document.activeElement.id;
if(same)app.querySelectorAll("input,select,textarea").forEach(el=>{if(el.id&&el.type!="file")keep[el.id]=el.type=="checkbox"?el.checked:el.value});
lastKey=key;S.fresh=false;app.innerHTML=h+FOOT;
for(const id in keep){const el=document.getElementById(id);if(el){if(el.type=="checkbox")el.checked=keep[id];else el.value=keep[id]}}
if(same&&foc){const el=document.getElementById(foc);if(el&&el.focus)el.focus({preventScroll:true})}
window.scrollTo(0,y);
if(S.hlGo){S.hlGo=false;const c=document.getElementById("rq"+S.hl);if(c)c.scrollIntoView({block:"center"})}
document.title=(unread()?"("+unread()+") ":"")+"Aayush Computers"}
document.addEventListener("submit",e=>{e.preventDefault();if(!S.user||S.recovery)authAct(e.target.dataset.a)});
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.tagName=="FORM")return;const a=el.dataset.a,id=+el.dataset.id,v=el.dataset.v;
if(!S.user||S.recovery){authAct(a,v);return}
const run=async f=>{if(S.busy)return;S.busy=true;el.disabled=true;try{await f()}catch(err){toast(dbMsg(err),false)}finally{S.busy=false;if(el.isConnected)el.disabled=false}};
const phoneOk=()=>{const p=parseId(val("mp"));if(!p||!p.phone){toast("Enter a valid 10-digit mobile number",false);return null}return p.phone};
if(a=="logout"){S.user=null;S.mode="signin";render();if(sb)sb.auth.signOut()}
else if(a=="nav"){if(v!=S.view)setPhoto(null);S.view=v;if(v=="shop"){S.cat="All";S.q=""}if(v=="notes"){S.newIds=new Set(S.notes.filter(n=>!n.read).map(n=>n.id));S.nf="all";S.mr=markRead()}else S.newIds.clear();render();if(v=="notes")S.mr.then(loadData);else if(v!="profile"&&v!="home")loadData()}
else if(a=="cat"){if(v=="Repair"){S.ft="service";S.view="newreq"}else{S.cat=v;S.q="";S.view="shop"}render()}
else if(a=="chip"){S.cat=v;render()}
else if(a=="ofilter"){S.of=v;render()}
else if(a=="nfilter"){S.nf=v;render()}
else if(a=="openn"){openNote(id)}
else if(a=="popx"){popHide()}
else if(a=="clearq"){S.q="";render()}
else if(a=="newreq"){S.ft=v;S.view="newreq";render()}
else if(a=="submit"){const t=val("ti");if(!t){toast("Enter the device or product",false);return}const ph=phoneOk();if(!ph)return;run(()=>add(val("ty"),t,val("de"),val("dv"),ph))}
else if(a=="order"){S.op=id;S.view="order";render();window.scrollTo(0,0)}
else if(a=="placeorder"){const p=S.products.find(x=>x.id==S.op);if(!p)return;const ph=phoneOk();if(!ph)return;const note=val("de");run(()=>add("order",p.name,rs(p.price)+(note?" · "+note:""),"",ph))}
else if(a=="adv"){const r=S.reqs.find(x=>x.id==id);if(!r)return;const next=FLOW[r.type][r.s+1];run(async()=>{const {data,error}=await sb.from("requests").update({status:next,owner_note:null}).eq("id",id).select("id");if(error)return toast(dbMsg(error),false);if(!data.length)return toast("Only the owner can change the status",false);await loadData();toast("Status updated: "+next)})}
else if(a=="addp"){const f=readProd();if(!f)return;run(async()=>{if(f.file)f.row.image_url=await uploadPhoto(f.file);const {error}=await sb.from("products").insert(f.row);if(error){if(f.row.image_url)removePhoto(f.row.image_url);return toast(dbMsg(error),false)}setPhoto(null);S.fresh=true;await loadData();toast("Added and listed: "+f.row.name)})}
else if(a=="editp"){setPhoto(null);S.ep=id;S.view="pedit";render();window.scrollTo(0,0)}
else if(a=="savep"){const p=S.products.find(x=>x.id==S.ep),f=readProd();if(!p||!f)return;run(async()=>{const old=p.img;if(f.file)f.row.image_url=await uploadPhoto(f.file);else if(f.remove)f.row.image_url=null;
const {data,error}=await sb.from("products").update(f.row).eq("id",p.id).select("id");if(error||!data.length){if(f.file)removePhoto(f.row.image_url);return toast(error?dbMsg(error):"Only the owner can change products",false)}
if(old&&(f.file||f.remove))removePhoto(old);setPhoto(null);S.view="prod";await loadData();toast("Saved: "+f.row.name)})}
else if(a=="togp"){const p=S.products.find(x=>x.id==id);if(!p)return;run(async()=>{const {data,error}=await sb.from("products").update({active:!p.on}).eq("id",id).select("id");if(error)return toast(dbMsg(error),false);if(!data.length)return toast("Only the owner can change products",false);await loadData();toast(p.on?"De-listed: customers no longer see "+p.name:"Listed again: "+p.name)})}});
document.addEventListener("change",e=>{if(e.target.id=="pf"&&e.target.files&&e.target.files[0]){setPhoto(e.target.files[0]);const b=document.getElementById("pfprev");b.hidden=false;b.innerHTML='<img alt="Selected photo" src="'+S.photoUrl+'">'}});
document.addEventListener("touchstart",()=>{},{passive:true}); // lets iPhones show the pressed colour
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="q"){S.q=e.target.value.trim();S.cat="All";S.view="shop";render()}});
if(sb){sb.auth.onAuthStateChange((ev,session)=>{
if(ev=="PASSWORD_RECOVERY"){S.recovery=true;S.mode="newpw";S.info=""}
if(ev=="TOKEN_REFRESHED")return;
setTimeout(()=>loadUser(session),0)})} // setTimeout: Supabase advises not to query inside this callback
window.addEventListener("focus",()=>{if(S.user&&!S.recovery)loadData()});
render();
{const q=new URLSearchParams(location.hash.slice(1)+"&"+location.search.slice(1)),err=q.get("error_description");
