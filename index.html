<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aayush Computers</title>
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#0f172a;--mute:#5b6678;--line:#e2e8f0;--navy:#143560;--blue:#2563eb;--green:#16a34a;--tile:#eef3ff;--warn:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--card:#16202f;--ink:#e8edf5;--mute:#9aa7bb;--line:#26344a;--tile:#1a2a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1420;--card:#16202f;--ink:#e8edf5;--mute:#9aa7bb;--line:#26344a;--tile:#1a2a45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;min-height:100vh;margin:0 auto;background:var(--bg);padding-bottom:84px;position:relative}
.hd{background:var(--navy);color:#fff;padding:16px 18px 18px}
.hd.slim{padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:48px;padding:0 8px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}.logo img{height:30px;width:auto;display:block}
.brand b{display:block;font-size:1.35rem;letter-spacing:.01em;line-height:1.1}
.brand small{opacity:.9;font-size:.92rem}
.brand .sp{flex:1}
.ib{background:none;border:0;color:#fff;padding:4px;cursor:pointer}
h1{font-size:1.6rem;margin:16px 0 2px;line-height:1.15}
.hd p{margin:0 0 14px;opacity:.9}
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#64748b;border-radius:14px;padding:0 14px}
.search input{flex:1;border:0;background:none;padding:14px 0;font:inherit;color:#0f172a;outline:0;min-width:0}
.body{padding:18px}
h2{font-size:1.2rem;margin:0 0 12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--tile);border:0;border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.cat svg{color:var(--blue)}
.assist{background:var(--tile);border-radius:14px;padding:16px;margin-top:18px}
.assist h2{margin-bottom:6px}
.assist p{margin:0 0 14px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;color:#fff;background:var(--blue);cursor:pointer;text-decoration:none}
.b.g{background:var(--green)}
.b.o{background:none;color:var(--ink);border:1px solid var(--line)}
.b.sm{padding:8px 14px;font-size:.92rem;display:inline-flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mute{color:var(--mute);font-size:.9rem}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--tile);color:var(--blue)}
.tag.done{background:var(--green);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 0 12px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.steps{list-style:none;margin:12px 0 10px;padding:0 0 0 6px;border-left:2px solid var(--line)}
.steps li{position:relative;padding:0 0 9px 18px;color:var(--mute);font-size:.93rem}
.steps li::before{content:"";position:absolute;left:-8px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--green);border-color:var(--green)}
.steps li.now{font-weight:600}
.steps li.now::before{box-shadow:0 0 0 4px rgba(22,163,74,.2)}
.steps small{color:var(--mute);font-weight:400;margin-left:6px}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:.92rem}
input.f,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}
textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--tile);border-radius:12px;padding:4px;margin:6px 0 14px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--blue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats .card{margin:0;text-align:center;padding:12px 6px}
.stats b{display:block;font-size:1.6rem}
.pc{display:flex;gap:12px;align-items:center}.art{flex:none;width:96px;height:72px;border-radius:10px;background:var(--tile);display:grid;place-items:center}.art svg{width:92px;height:68px}.banner{background:var(--tile);border-radius:10px;padding:10px 12px;margin-bottom:12px}.bell{position:relative}.dot{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font:700 .68rem system-ui,sans-serif;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;font-style:normal}.sms{margin-top:6px;font-size:.82rem;color:var(--green);font-weight:600}.or{text-align:center;color:var(--mute);margin:12px 0 0;font-size:.85rem}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:4}
.nav button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:.72rem;cursor:pointer;padding:2px 14px}
.nav button.on{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:6;max-width:90%;text-align:center}
.lnk{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:8px 0}.lnk.r{display:block;margin-left:auto}.lnk.c{display:block;margin:6px auto 0}.note{text-align:center;color:var(--mute);font-size:.85rem;margin:8px 0 0}.ok{color:var(--green);font-weight:600;margin:12px 0 0}
.hint{background:var(--tile);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:.88rem;color:var(--mute)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
</style>
</head>

clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',

search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',Laptops:'<rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M2 19h20"/>',
Printers:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',CCTV:'<path d="M3 8l12-4 3 7-12 4z"/><path d="M18 11l3 1M6 15v5h4"/>',

Repair:'<path d="M15 5a4 4 0 0 0-4 5l-7 7 3 3 7-7a4 4 0 0 0 5-4l-3 2-2-2 2-3z"/>',bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',mon:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'};

const CATS=["Laptops","Printers","CCTV","Accessories","Networking","Repair"];
const FLOW={service:["Received","Diagnosed","In repair","Ready for pickup","Delivered"],order:["Placed","Confirmed","Packed","Out for delivery","Delivered"],enquiry:["New","Quote sent","Closed"]};

async function loadData(){if(!S.user||!sb)return;const uid=S.user.id;
const [p,r,n]=await Promise.all([
sb.from("products").select("*").order("category").order("price"),
sb.from("requests").select("*,status_history(status,changed_at),profiles(full_name,email,phone)").order("created_at"),

+(e?'<div class="seg" role="tablist"><button type="button" role="tab" aria-selected="'+(m=="signin")+'" class="'+(m=="signin"?"on":"")+'" data-a="mode" data-v="signin">Sign in</button><button type="button" role="tab" aria-selected="'+(m=="signup")+'" class="'+(m=="signup"?"on":"")+'" data-a="mode" data-v="signup">Create account</button></div>':'')
+'<form data-a="'+m+'" novalidate>'
+(m=="signup"?f("lnm","Full name","text","name",' value="'+esc(S.lf.name||"")+'"'):'')
+(e||m=="forgot"?f("lid","Mobile number or email","text","username",' placeholder="98765 43210 or name@gmail.com" autocapitalize="none" spellcheck="false" value="'+esc(S.lf.id||"")+'"'):'')
+(m=="verify"||m=="reset"?f("lcode","Code","text","one-time-code",' inputmode="numeric" maxlength="10"'):'')
+(m!="verify"&&m!="forgot"?f("lpw",np?"New password":"Password","password",np?"new-password":"current-password",np?' placeholder="At least '+MINPW+' characters"':''):'')
+(np?f("lpw2","Confirm password","password","new-password"):'')
+(m=="signin"?'<button type="button" class="lnk r" data-a="mode" data-v="forgot">Forgot password?</button>':'')
+(S.info?'<p class="ok" role="status">'+esc(S.info)+'</p>':'')
+'<p><button type="submit" class="b" style="width:100%">'+t[2]+'</button></p></form>'
+(m=="verify"?'<button type="button" class="lnk c" data-a="resend">Resend code</button>':'')
+(!e?'<button type="button" class="lnk c" data-a="mode" data-v="signin">Back to sign in</button>':'')
+(e?'<p class="or">or</p><button type="button" class="b o" style="width:100%;margin-top:10px" data-a="google"><b style="color:#4285f4">G</b> '+(m=="signup"?"Sign up with Google":"Continue with Google")+'</button><p class="note">Use your Gmail account. New users get an account automatically.</p>':'')
+'</div>'}
const val=(id,raw)=>{const el=document.getElementById(id);return el?(raw?el.value:el.value.trim()):""};
function goMode(m,info){S.lf={id:val("lid")||S.lf.id||"",name:val("lnm")};S.mode=m;S.info=info||"";render()}
function newPwOk(){const p=val("lpw",1);if(p.length<MINPW){toast("Password must be at least "+MINPW+" characters",false);return false}if(p!==val("lpw2",1)){toast("Passwords do not match",false);return false}return true}
const creds=p=>p.phone?{phone:p.phone}:{email:p.email};
function authMsg(e){const c=(e&&e.code)||"",m=((e&&e.message)||"").toLowerCase();
if(c=="invalid_credentials"||m.includes("invalid login credentials"))return"Wrong mobile number/email or password";
if(c=="user_already_exists"||m.includes("already registered"))return"An account already exists. Sign in instead.";
if(c=="otp_expired"||m.includes("token has expired"))return"That code is wrong or has expired. Request a new one.";
if(c=="same_password")return"Choose a password different from your old one";
if(c=="weak_password")return"That password is too weak. Use a longer one.";
if(c=="phone_provider_disabled"||(m.includes("phone")&&m.includes("disabled")))return"Mobile number sign-in isn't available yet. Use your email or Google.";
if(c.startsWith("over_")||m.includes("rate limit"))return"Too many attempts. Please wait a minute and try again.";
if(m.includes("failed to fetch"))return"Couldn't connect. Check your internet and try again.";
return(e&&e.message)||"Something went wrong. Please try again."}
// Signed-in state comes from Supabase; the role (customer or owner) comes from the profiles table.
async function loadUser(session){
if(!session){S.user=null;S.recovery=false;S.boot=false;S.loaded=false;S.reqs=[];S.notes=[];if(live){sb.removeChannel(live);live=null}render();return}
const u=session.user,md=u.user_metadata||{};let role="customer",name=md.full_name||md.name||"";
let phone=u.phone?"+"+u.phone.replace(/^\+/,""):"";
try{const {data}=await sb.from("profiles").select("role,full_name,phone").eq("id",u.id).maybeSingle();if(data){role=data.role||role;name=data.full_name||name;phone=data.phone||phone}}catch(e){}
const same=S.user&&S.user.id==u.id;
S.user={role,id:u.id,email:u.email||"",phone:showPh(phone),name};
if(!same){S.view=role=="owner"?"orq":"home";S.pending=null;S.lf={};S.info="";S.loaded=false;S.reqs=[];S.notes=[];S.products=[];if(!S.recovery)S.mode="signin";listen()}
S.boot=false;render();if(!same)loadData()}
async function authAct(a,v){
if(a=="mode"){if(S.recovery){S.recovery=false;if(sb)sb.auth.signOut()}goMode(v);return}
if(!sb){toast("Couldn't connect. Check your internet and reload the page.",false);return}
const btn=document.querySelector("#app form [type=submit]"),label=btn&&btn.textContent;
if(btn){btn.disabled=true;btn.textContent="Please wait…"}
try{await authRun(a)}catch(e){toast(authMsg(e),false)}
finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=label}}}
async function authRun(a){
const badId=()=>toast("Enter a 10-digit mobile number or a valid email",false),need=r=>{if(r.error)throw r.error;return r.data};
if(a=="google"){const st=await fetch(SB_URL+"/auth/v1/settings",{headers:{apikey:SB_KEY}}).then(r=>r.json()).catch(()=>null);
if(st&&st.external&&!st.external.google)return toast("Google sign-in isn't switched on yet. Use your email for now.",false);
need(await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:HERE}}));return}
if(a=="resend"){const p=S.pending;if(!p)return;need(await sb.auth.resend(p.phone?{type:"sms",phone:p.phone}:{type:"signup",email:p.email,options:{emailRedirectTo:HERE}}));return toast(p.phone?"New code sent":"New email sent",false)}
if(a=="signin"){const p=parseId(val("lid")),pw=val("lpw",1);if(!p)return badId();if(!pw)return toast("Enter your password",false);
const {error}=await sb.auth.signInWithPassword({...creds(p),password:pw});if(!error)return;
if(error.code=="email_not_confirmed"||error.code=="phone_not_confirmed"||/not confirmed/i.test(error.message)){S.pending=p;await sb.auth.resend(p.phone?{type:"sms",phone:p.phone}:{type:"signup",email:p.email,options:{emailRedirectTo:HERE}});return goMode("verify",sentTo(p))}
throw error}
if(a=="signup"){const n=val("lnm"),p=parseId(val("lid"));if(!n)return toast("Enter your name",false);if(!p)return badId();if(!newPwOk())return;
const opt={data:{full_name:n}};if(p.email)opt.emailRedirectTo=HERE;
const d=need(await sb.auth.signUp({...creds(p),password:val("lpw",1),options:opt}));
if(d.user&&d.user.identities&&d.user.identities.length===0)return toast("An account already exists. Sign in instead.",false);
if(d.session)return;S.pending=p;return goMode("verify",sentTo(p))}
if(a=="verify"){const p=S.pending,c=val("lcode");if(!p)return goMode("signin");if(!c)return toast("Enter the code",false);
need(await sb.auth.verifyOtp(p.phone?{phone:p.phone,token:c,type:"sms"}:{email:p.email,token:c,type:"email"}));return}
if(a=="forgot"){const p=parseId(val("lid"));if(!p)return badId();
need(p.phone?await sb.auth.signInWithOtp({phone:p.phone,options:{shouldCreateUser:false}}):await sb.auth.resetPasswordForEmail(p.email,{redirectTo:HERE}));
S.pending=p;return goMode("reset",sentTo(p))}
if(a=="reset"){const p=S.pending,c=val("lcode");if(!p)return goMode("forgot");if(!c)return toast("Enter the code",false);if(!newPwOk())return;
const pw=val("lpw",1);need(await sb.auth.verifyOtp(p.phone?{phone:p.phone,token:c,type:"sms"}:{email:p.email,token:c,type:"recovery"}));
need(await sb.auth.updateUser({password:pw}));return toast("Password saved")}
if(a=="newpw"){if(!newPwOk())return;need(await sb.auth.updateUser({password:val("lpw",1)}));S.recovery=false;S.mode="signin";
if(!S.user)await loadUser((await sb.auth.getSession()).data.session);return toast("Password saved")}}
function home(){return '<div class="hd"><div class="brand"><div class="logo">'+ic("mon",26)+'</div><div><b>AAYUSH COMPUTERS</b><small>Your Trusted Technology Partner</small></div><span class="sp"></span>'+bellBtn()+'<button class="ib" data-a="nav" data-v="profile" aria-label="Profile">'+ic("user",32)+'</button></div><h1>Welcome to Aayush Computers!</h1><p>All Computer Solutions Under One Roof.</p><div class="search">'+ic("search",20)+'<input id="q" placeholder="Search laptops, printers, CCTV..." aria-label="Search products"></div></div><div class="body"><h2>Explore Categories</h2><div class="cats">'+CATS.map(c=>'<button class="cat" data-a="cat" data-v="'+c+'">'+ic(c,30)+c+'</button>').join("")+'</div><div class="assist"><h2>Need assistance?</h2><p>Connect with our team for product enquiries and technical support.</p><p style="margin:-6px 0 14px;font-weight:600;color:var(--ink)">'+OWNER+' · 90064 34998</p><div class="two"><a class="b g" href="tel:'+SHOP_PHONE+'">'+ic("phone",20)+'Call Now</a><button class="b" data-a="newreq" data-v="enquiry">'+ic("chat",20)+'Enquiry</button></div></div></div>'}
function shop(){const q=S.q.toLowerCase(),L=S.products.filter(p=>p.on&&(S.cat=="All"||p.cat==S.cat)&&p.name.toLowerCase().includes(q));
return bar("Shop")+'<div class="body"><div class="chips">'+["All",...CATS.slice(0,5)].map(c=>'<button class="chip '+(S.cat==c?"on":"")+'" data-a="chip" data-v="'+c+'">'+c+'</button>').join("")+'</div>'+fromBanner()+(S.q?'<p class="mute">Results for “'+esc(S.q)+'” <button class="chip" data-a="clearq">Clear</button></p>':'')+(!S.loaded?WAIT:L.length?L.map(p=>'<div class="card pc"><div class="art">'+art(p)+'</div><div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(p.name)+'</div><div class="mute">'+p.cat+(p.used?" · Second-hand":"")+'</div><div style="font-weight:700;margin:4px 0 8px">'+rs(p.price)+'</div><button class="b sm" data-a="order" data-id="'+p.id+'">Order</button></div></div>').join(""):'<div class="card"><b>No products found.</b><p class="mute">Try another category, or send us an enquiry.</p><button class="b sm" data-a="newreq" data-v="enquiry">Send enquiry</button></div>')+'</div>'}
function reqs(){const m=S.reqs.filter(r=>r.uid==S.user.id);return bar("My requests")+'<div class="body">'+(!S.loaded?WAIT:m.length?m.slice().reverse().map(r=>reqCard(r,false)).join(""):'<div class="card"><b>Nothing here yet.</b><p class="mute">Book a repair or send an enquiry to get started.</p></div>')+'<button class="b" style="width:100%" data-a="newreq" data-v="service">New request</button></div>'}
function newreq(){return bar("New request")+'<div class="body"><div class="card"><label for="ty" style="margin-top:0">What do you need?</label><select id="ty"><option value="service" '+(S.ft=="service"?"selected":"")+'>Repair my device</option><option value="enquiry" '+(S.ft=="enquiry"?"selected":"")+'>Ask about a product</option></select><label for="dv">Type</label><select id="dv"><option>Computer / Laptop</option><option>Printer</option><option>CCTV camera</option><option>Networking</option><option>Other</option></select><label for="ti">Device or product</label><input class="f" id="ti" placeholder="e.g. HP laptop, or 4 CCTV cameras"><label for="mp">Mobile number</label><input class="f" id="mp" inputmode="tel" autocomplete="tel" value="'+esc(S.user.phone||"")+'"><label for="de">Describe the problem or requirement</label><textarea id="de"></textarea><p><button class="b" style="width:100%" data-a="submit">Send request</button></p></div></div>'}
function profile(){const o=S.user.role=="owner";return bar("Profile")+'<div class="body"><div class="card"><b>'+esc(S.user.name||(o?OWNER:"Customer"))+'</b><div class="mute">'+(o?"Shop owner · ":"")+esc(S.user.phone||S.user.email)+'</div></div><button class="b o" style="width:100%" data-a="logout">Sign out</button></div>'}
function customer(){const v=S.view,m={home,shop,reqs,newreq,profile,notes:notesView,order:orderView};return (m[v]||home)()+nav([["home","Home","home"],["shop","Shop","bag"],["reqs","Requests","clip"],["profile","Profile","user"]])}
function owner(){const R=S.reqs,open=R.filter(r=>r.s<FLOW[r.type].length-1);let b;if(S.view=="notes")return notesView()+nav([["orq","Requests","clip"],["prod","Products","bag"],["profile","Profile","user"]]);
if(S.view=="profile")return profile()+nav([["orq","Requests","clip"],["prod","Products","bag"],["profile","Profile","user"]]);
if(S.view=="prod"){b=bar("Products")+'<div class="body"><div class="card"><label for="pn" style="margin-top:0">Add a product</label><input class="f" id="pn" placeholder="Name"><div class="two"><div><label for="pp">Price (₹)</label><input class="f" id="pp" inputmode="numeric"></div><div><label for="pc">Category</label><select id="pc">'+CATS.slice(0,5).map(c=>'<option>'+c+'</option>').join("")+'</select></div></div><p><button class="b" style="width:100%" data-a="addp">Add product</button></p></div>'+(!S.loaded?WAIT:'')+S.products.map(p=>'<div class="card row" style="align-items:center"><div><b>'+esc(p.name)+'</b><div class="mute">'+rs(p.price)+' · '+p.cat+' · '+(p.on?"Visible":"Hidden")+'</div></div><button class="b o sm" data-a="togp" data-id="'+p.id+'">'+(p.on?"Hide":"Show")+'</button></div>').join("")+'</div>'}
else{b=bar("Requests")+'<div class="body"><div class="stats"><div class="card"><b>'+open.length+'</b><span class="mute">Open</span></div><div class="card"><b>'+R.filter(r=>r.type=="service"&&r.s<4).length+'</b><span class="mute">Repairs</span></div><div class="card"><b>'+R.filter(r=>r.type!="service"&&r.s==0).length+'</b><span class="mute">New</span></div></div>'+(!S.loaded?WAIT:open.length?open.slice().reverse().map(r=>reqCard(r,true)).join(""):'<div class="card"><b>All caught up.</b><p class="mute">No open requests right now.</p></div>')+'</div>'}
return b+nav([["orq","Requests","clip"],["prod","Products","bag"],["profile","Profile","user"]])}
function render(){const y=window.scrollY;let h=S.boot?'<div class="hd"><div class="brand"><div class="logo">'+ic("mon")+'</div><div><b>AAYUSH COMPUTERS</b><small>Your Trusted Technology Partner</small></div></div></div><div class="body"><p class="mute" role="status">Loading…</p></div>':(!S.user||S.recovery)?login():S.user.role=="owner"?owner():customer();document.getElementById("app").innerHTML=h;window.scrollTo(0,y)}
document.addEventListener("submit",e=>{e.preventDefault();if(!S.user||S.recovery)authAct(e.target.dataset.a)});
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.tagName=="FORM")return;const a=el.dataset.a,id=+el.dataset.id,v=el.dataset.v;
if(!S.user||S.recovery){authAct(a,v);return}
const run=async f=>{if(S.busy)return;S.busy=true;el.disabled=true;try{await f()}catch(err){toast(dbMsg(err),false)}finally{S.busy=false;if(el.isConnected)el.disabled=false}};
const phoneOk=()=>{const p=parseId(val("mp"));if(!p||!p.phone){toast("Enter a valid 10-digit mobile number",false);return null}return p.phone};
if(a=="logout"){S.user=null;S.mode="signin";render();if(sb)sb.auth.signOut()}
else if(a=="nav"){S.view=v;if(v=="shop"){S.cat="All";S.q=""}if(v=="notes")markRead();render();if(v!="profile"&&v!="home")loadData()}
else if(a=="cat"){if(v=="Repair"){S.ft="service";S.view="newreq"}else{S.cat=v;S.q="";S.view="shop"}render()}
else if(a=="chip"){S.cat=v;render()}
else if(a=="clearq"){S.q="";render()}
else if(a=="newreq"){S.ft=v;S.view="newreq";render()}
else if(a=="submit"){const t=val("ti");if(!t){toast("Enter the device or product",false);return}const ph=phoneOk();if(!ph)return;run(()=>add(val("ty"),t,val("de"),val("dv"),ph))}
else if(a=="order"){S.op=id;S.view="order";render();window.scrollTo(0,0)}
else if(a=="placeorder"){const p=S.products.find(x=>x.id==S.op);if(!p)return;const ph=phoneOk();if(!ph)return;const note=val("de");run(()=>add("order",p.name,rs(p.price)+(note?" · "+note:""),"",ph))}
else if(a=="adv"){const r=S.reqs.find(x=>x.id==id);if(!r)return;const next=FLOW[r.type][r.s+1];run(async()=>{const {data,error}=await sb.from("requests").update({status:next,owner_note:null}).eq("id",id).select("id");if(error)return toast(dbMsg(error),false);if(!data.length)return toast("Only the owner can change the status",false);await loadData();toast("Status updated: "+next)})}
else if(a=="addp"){const n=val("pn"),pr=Math.round(+val("pp"));if(!n||!(pr>0)){toast("Enter a name and a price",false);return}run(async()=>{const {error}=await sb.from("products").insert({name:n,price:pr,category:val("pc")});if(error)return toast(dbMsg(error),false);await loadData();toast("Product added")})}
else if(a=="togp"){const p=S.products.find(x=>x.id==id);if(!p)return;run(async()=>{const {error}=await sb.from("products").update({active:!p.on}).eq("id",id);if(error)return toast(dbMsg(error),false);await loadData()})}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="q"){S.q=e.target.value.trim();S.cat="All";S.view="shop";render()}});
if(sb){sb.auth.onAuthStateChange((ev,session)=>{
if(ev=="PASSWORD_RECOVERY"){S.recovery=true;S.mode="newpw";S.info=""}
if(ev=="TOKEN_REFRESHED")return;
setTimeout(()=>loadUser(session),0)})} // setTimeout: Supabase advises not to query inside this callback
window.addEventListener("focus",()=>{if(S.user&&!S.recovery)loadData()});
render();
{const q=new URLSearchParams(location.hash.slice(1)+"&"+location.search.slice(1)),err=q.get("error_description");
if(err){toast(err.replace(/\+/g," "),false);history.replaceState(null,"",HERE)}}
